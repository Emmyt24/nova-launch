[package]
name = "token-factory"
version = "0.1.0"
edition = "2021"
autoexamples = false
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { version = "29.0.1", features = ["hazmat-address"] }

[dev-dependencies]
soroban-sdk = { version = "29.0.1", features = ["testutils", "hazmat-address"] }
proptest = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core"] }

[[test]]
name = "contract_replay_regression_test"
path = "tests/contract_replay_regression_test.rs"

[[test]]
name = "dividend_distribution_multi_epoch_test"
path = "tests/dividend_distribution_multi_epoch_test.rs"

[features]
legacy-tests = []

# Proptest configuration for CI
# Ensures deterministic, reproducible property test runs
[package.metadata.proptest]
# Use fixed seed for deterministic test runs in CI
rng_algorithm = "chacha"
# Reduce cases for faster CI runs while maintaining coverage
cases = 100
# Maximum shrink iterations for failure minimization
max_shrink_iters = 1000
# Timeout per test case (in milliseconds)
timeout = 5000

# Release profile tuned for Soroban contract WASM.
# - overflow-checks: trap on arithmetic overflow instead of silently wrapping
#   (required for the overflow-safe arithmetic audit).
# - opt-level = "z": optimize for size to keep WASM within ledger limits.
# - lto: link-time optimization to further reduce binary size.
# - panic = "abort": no unwinding machinery in the WASM binary.
# - strip = "symbols": drop symbol tables from the final artifact.
[profile.release]
overflow-checks = true
opt-level = "z"
lto = true
panic = "abort"
strip = "symbols"